<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDIOMA — Frédéric Magne Thérapeute</title>
  <link rel="icon" href="favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #181628; }

    #medioma-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── PLAYER ─────────────────────────────────── */
    #medioma-player {
      position: fixed;
      bottom: 24px;
      right: 80px;
      width: 64px;
      height: 64px;
      background: rgba(22, 20, 38, 0.97);
      border: 1px solid rgba(212, 168, 75, 0.3);
      border-radius: 50%;
      z-index: 9999;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s, transform 0.3s;
      isolation: isolate;
      overflow: hidden;
    }
    #medioma-player:hover {
      border-color: rgba(212, 168, 75, 0.6);
      transform: scale(1.05);
    }
    #medioma-player.playing {
      border-color: rgba(212, 168, 75, 0.55);
    }

    /* Mandala */
    #mp-mandala {
      width: 46px;
      height: 46px;
      object-fit: contain;
      mix-blend-mode: multiply;
      opacity: 0.85;
      transition: opacity 0.3s;
      border-radius: 50%;
    }
    #medioma-player:hover #mp-mandala { opacity: 1; }
    #medioma-player.playing #mp-mandala {
      animation: mp-spin 14s linear infinite;
      opacity: 1;
    }
    @keyframes mp-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Anneau de progression */
    #mp-ring {
      position: absolute;
      top: 0; left: 0;
      width: 64px;
      height: 64px;
      transform: rotate(-90deg);
      pointer-events: none;
    }
    #mp-ring-track {
      fill: none;
      stroke: rgba(212, 168, 75, 0.1);
      stroke-width: 2;
    }
    #mp-ring-fill {
      fill: none;
      stroke: #d4a84b;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 188.5;
      stroke-dashoffset: 188.5;
      transition: stroke-dashoffset 0.15s linear;
    }

    /* Tooltip */
    #mp-tooltip {
      position: absolute;
      bottom: 72px;
      right: 0;
      background: rgba(22, 20, 38, 0.95);
      color: #d4a84b;
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      padding: 5px 12px;
      border: 1px solid rgba(212, 168, 75, 0.25);
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #medioma-player:hover #mp-tooltip { opacity: 1; }

    /* ── MOBILE ──────────────────────────────────── */
    @media (max-width: 768px) {
      #medioma-player {
        width: 50px;
        height: 50px;
        right: 16px;
        bottom: 80px;
      }
      #mp-mandala { width: 36px; height: 36px; }
      #mp-ring { width: 50px; height: 50px; }
      #mp-tooltip { display: none; }
    }
    @media (max-width: 380px) {
      #medioma-player { width: 44px; height: 44px; right: 12px; }
      #mp-mandala { width: 32px; height: 32px; }
      #mp-ring { width: 44px; height: 44px; }
    }
  </style>
</head>
<body>

  <iframe
    id="medioma-frame"
    src="index-content.html"
    title="MEDIOMA — Cabinet de Frédéric Magne Thérapeute"
  ></iframe>

  <div
    id="medioma-player"
    role="button"
    tabindex="0"
    aria-label="Activer l'ambiance musicale MEDIOMA"
    aria-pressed="false"
  >
    <span id="mp-tooltip">Ambiance MEDIOMA ♪</span>
    <svg id="mp-ring" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle id="mp-ring-track" cx="32" cy="32" r="30"/>
      <circle id="mp-ring-fill"  cx="32" cy="32" r="30"/>
    </svg>
    <img id="mp-mandala" src="assets/img/medioma-mandala.png" alt="">
    <audio id="mp-audio" loop preload="none">
      <source id="mp-source" src="assets/audio/medioma-seuil.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script>
  (function () {
    const PAGES_PRESENCE = [
      'magnetisme','chakras','nettoyage',
      'mediation','prestations','contact','rendez-vous'
    ];
    const CIRCUMFERENCE = 188.5;

    const frame    = document.getElementById('medioma-frame');
    const player   = document.getElementById('medioma-player');
    const audio    = document.getElementById('mp-audio');
    const source   = document.getElementById('mp-source');
    const ringFill = document.getElementById('mp-ring-fill');

    let playing    = false;
    let prog       = 0;
    let tmr        = null;
    let currentSrc = 'seuil';

    /* ── Progression ring ───────────────────── */
    function setRing(pct) {
      const offset = CIRCUMFERENCE - (pct / 100) * CIRCUMFERENCE;
      ringFill.style.strokeDashoffset = offset.toFixed(2);
    }

    /* ── Fade volume ────────────────────────── */
    function fadeVolume(from, to, ms, cb) {
      const steps = 25;
      const dt    = ms / steps;
      const delta = (to - from) / steps;
      let cur = from;
      const t = setInterval(() => {
        cur += delta;
        audio.volume = Math.min(1, Math.max(0, cur));
        if ((delta > 0 && cur >= to) || (delta < 0 && cur <= to)) {
          clearInterval(t);
          if (cb) cb();
        }
      }, dt);
    }

    /* ── Start / Stop ───────────────────────── */
    function startPlay(isRestore) {
      audio.volume = 0;
      audio.play().then(() => {
        fadeVolume(0, 0.27, isRestore ? 400 : 2000);
        player.classList.add('playing');
        player.setAttribute('aria-pressed', 'true');
        playing = true;
        localStorage.setItem('medioma_audio', 'on');
        tmr = setInterval(() => {
          prog = (prog + 0.22) % 100;
          setRing(prog);
        }, 100);
      }).catch(() => {});
    }

    function stopPlay() {
      fadeVolume(audio.volume, 0, 900, () => audio.pause());
      player.classList.remove('playing');
      player.setAttribute('aria-pressed', 'false');
      playing = false;
      localStorage.setItem('medioma_audio', 'off');
      clearInterval(tmr);
      setRing(0);
      prog = 0;
    }

    function toggle() { playing ? stopPlay() : startPlay(false); }

    /* ── Crossfade entre pistes ─────────────── */
    function switchTrack(newSrc) {
      if (newSrc === currentSrc) return;
      currentSrc = newSrc;
      const path = newSrc === 'presence'
        ? 'assets/audio/medioma-presence.mp3'
        : 'assets/audio/medioma-seuil.mp3';
      if (!playing) {
        source.src = path;
        audio.load();
        return;
      }
      fadeVolume(audio.volume, 0, 800, () => {
        audio.pause();
        source.src = path;
        audio.load();
        audio.volume = 0;
        audio.play().then(() => fadeVolume(0, 0.27, 800)).catch(() => {});
      });
    }

    /* ── Détection de page via iframe ───────── */
    frame.addEventListener('load', () => {
      try {
        const path = frame.contentWindow.location.pathname.toLowerCase();
        history.replaceState({}, '', path === '/index.html' ? '/' : path);
        const isPres = PAGES_PRESENCE.some(p => path.includes(p));
        switchTrack(isPres ? 'presence' : 'seuil');
      } catch(e) {}
    });

    /* ── Events ─────────────────────────────── */
    player.addEventListener('click', toggle);
    player.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });

    if (localStorage.getItem('medioma_audio') === 'on') startPlay(true);
  })();
  </script>

</body>
</html>
