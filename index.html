<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MEDIOMA – Magnétiseur & Médium | Malemort (19360)</title>
  <meta name="description" content="Découvrez les soins énergétiques de Frédéric Magne, thérapeute à Malemort (Corrèze). Magnétisme, voyance, chakras, méditation. Réservez votre séance."/>
  <meta name="robots" content="index,follow"/>
  <link rel="canonical" href="https://cabinetmedioma.com/"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="favicon.png"/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://cabinetmedioma.com/"/>
  <meta property="og:title" content="MEDIOMA – Frédéric Magne | Magnétiseur & Médium à Malemort"/>
  <meta property="og:description" content="Frédéric Magne, thérapeute en bien-être à Malemort (Corrèze). Magnétisme, voyance, médiumité, nettoyage énergétique, initiation à la méditation. Sur rendez-vous."/>
  <meta property="og:image" content="https://cabinetmedioma.com/about-visual.png"/>
  <meta property="og:locale" content="fr_FR"/>
  <meta property="og:site_name" content="MEDIOMA – Frédéric Magne"/>

  <link rel="stylesheet" href="assets/css/medioma-audio.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0c0c; }

    /* Iframe principale — contenu du site */
    #medioma-frame {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* Player audio — widget fixe en bas à droite, au-dessus du contenu */
    #medioma-player-frame {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 300px;
      height: 110px;
      border: none;
      z-index: 100;
      border-radius: 12px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.55);
    }
  </style>
</head>
<body>

  <!-- Contenu principal du site -->
  <iframe
    id="medioma-frame"
    src="home.html"
    title="MEDIOMA – Cabinet de soin énergétique"
    allow="fullscreen"
  ></iframe>

  <!-- Player audio persistant : ne se recharge jamais, la musique continue entre les pages -->
  <iframe
    id="medioma-player-frame"
    src="medioma-player.html"
    title="Lecteur audio MEDIOMA"
    allow="autoplay"
  ></iframe>

  <script>
    // Détection de navigation dans l'iframe principale
    // → broadcast de la piste audio correspondante via BroadcastChannel
    (function(){
      var frame  = document.getElementById('medioma-frame');
      var bc     = new BroadcastChannel('medioma_track');

      // Pages de soins → piste "présence" (ambiance soin)
      var presencePages = ['chakras','magnetisme','harmonisation','bilan','meditation','nettoyage','voyance'];

      frame.addEventListener('load', function(){
        try {
          var url = frame.contentWindow.location.pathname.toLowerCase();
          var isPresence = presencePages.some(function(p){ return url.indexOf(p) !== -1; });
          bc.postMessage({ track: isPresence ? 'presence' : 'seuil' });
        } catch(e){}
      });
    })();
  </script>

</body>
</html>
