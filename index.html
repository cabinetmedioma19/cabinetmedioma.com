<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MEDIOMA – Magnétiseur & Médium | Malemort (19360)</title>
  <meta name="description" content="Découvrez les soins énergétiques de Frédéric Magne, thérapeute à Malemort (Corrèze). Magnétisme, voyance, chakras, méditation. Réservez votre séance."/>
  <meta name="robots" content="index,follow"/>
  <link rel="canonical" href="https://cabinetmedioma.com/"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="favicon.png"/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://cabinetmedioma.com/"/>
  <meta property="og:title" content="MEDIOMA – Frédéric Magne | Magnétiseur & Médium à Malemort"/>
  <meta property="og:description" content="Frédéric Magne, thérapeute en bien-être à Malemort (Corrèze). Magnétisme, voyance, médiumité, nettoyage énergétique, initiation à la méditation. Sur rendez-vous."/>
  <meta property="og:image" content="https://cabinetmedioma.com/about-visual.png"/>
  <meta property="og:locale" content="fr_FR"/>
  <meta property="og:site_name" content="MEDIOMA – Frédéric Magne"/>

  <!-- Styles du player audio -->
  <link rel="stylesheet" href="assets/css/medioma-audio.css">
  <link rel="stylesheet" href="assets/css/audioplayer.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0c0c; }

    /* Iframe principale — contenu des pages */
    #medioma-frame {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* Player audio — positionné au-dessus de l'iframe, persiste entre les pages */
    #medioma-player {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      z-index: 100 !important;
    }
    #mp-mobile {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 100 !important;
    }
    #mp-trigger {
      position: fixed !important;
      z-index: 100 !important;
    }
  </style>
</head>
<body>

  <!-- Iframe principale : contenu du site -->
  <iframe
    id="medioma-frame"
    src="home.html"
    title="MEDIOMA – Cabinet de soin énergétique"
    allow="fullscreen"
  ></iframe>

  <!--
    Le player audio est chargé ICI dans le shell (index.html).
    Il ne se recharge JAMAIS lors de la navigation entre les pages.
    audioplayer-shell.js expose window._mediomaSwitchTrack(isPres)
    pour changer de piste sans couper la musique.
  -->
  <script src="audioplayer-shell.js" defer></script>

  <script>
    (function(){
      var frame = document.getElementById('medioma-frame');

      // Pages de "présence" → piste soins & énergies
      var presencePages = [
        'magnetisme','chakras','nettoyage',
        'mediation','prestations','contact','rendez-vous',
        'harmonisation','bilan','voyance'
      ];

      // On ignore le tout premier load (home.html = seuil = piste par défaut déjà correcte)
      var firstLoad = true;
      frame.addEventListener('load', function(){
        if (firstLoad) { firstLoad = false; return; }
        try {
          var url = frame.contentWindow.location.pathname.toLowerCase();
          var isPres = presencePages.some(function(p){ return url.indexOf(p) !== -1; });
          // Demande au player de switcher la piste si nécessaire
          if (typeof window._mediomaSwitchTrack === 'function') {
            window._mediomaSwitchTrack(isPres);
          }
        } catch(e){}
      });
    })();
  </script>

</body>
</html>
