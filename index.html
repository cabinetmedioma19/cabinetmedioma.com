<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MEDIOMA – Magnétiseur & Médium | Malemort (19360)</title>
  <meta name="description" content="Découvrez les soins énergétiques de Frédéric Magne, thérapeute à Malemort (Corrèze). Magnétisme, voyance, chakras, méditation. Réservez votre séance."/>
  <meta name="robots" content="index,follow"/>
  <link rel="canonical" href="https://cabinetmedioma.com/"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="favicon.png"/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://cabinetmedioma.com/"/>
  <meta property="og:title" content="MEDIOMA – Frédéric Magne | Magnétiseur & Médium à Malemort"/>
  <meta property="og:description" content="Frédéric Magne, thérapeute en bien-être à Malemort (Corrèze). Magnétisme, voyance, médiumité, nettoyage énergétique, initiation à la méditation. Sur rendez-vous."/>
  <meta property="og:image" content="https://cabinetmedioma.com/about-visual.png"/>
  <meta property="og:locale" content="fr_FR"/>
  <meta property="og:site_name" content="MEDIOMA – Frédéric Magne"/>

  <link rel="stylesheet" href="assets/css/audioplayer.css"/>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0c0c; }
    #medioma-frame {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }
    /* Le player (z-index 9998 dans audioplayer.css) passe au-dessus de l'iframe */
  </style>
</head>
<body>

  <iframe
    id="medioma-frame"
    src="home.html"
    title="MEDIOMA – Cabinet de soin énergétique"
    allow="fullscreen"
  ></iframe>

  <!--
    Quand l'iframe navigue vers une nouvelle page :
    1. On lit l'URL chargée dans l'iframe
    2. On détermine si c'est une page PRÉSENCE ou SEUIL
    3. On demande au player de switcher la piste si nécessaire
  -->
  <script>
    (function () {
      var PRESENCE = ['magnetisme','chakras','nettoyage','mediation','prestations','contact','rendez-vous'];
      var frame    = document.getElementById('medioma-frame');

      frame.addEventListener('load', function () {
        try {
          var iPath  = frame.contentWindow.location.pathname.toLowerCase();
          var isPres = PRESENCE.some(function (p) { return iPath.indexOf(p) !== -1; });
          if (typeof window._mediomaSwitchTrack === 'function') {
            window._mediomaSwitchTrack(isPres);
          }
        } catch (e) { /* Cross-origin : ne devrait pas arriver en SAMEORIGIN */ }
      });
    })();
  </script>

  <script src="assets/js/audioplayer-shell.js" defer></script>

</body>
</html>
